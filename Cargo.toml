[workspace]
members = [
    "swamp-gguf",
    "swamp-tensors",
    "swamp-kernels",
    "swamp-engine",
    "swamp-server",
    "swamp-tools",
    "swamp-gpu",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
memmap2 = "0.9"
bytemuck = { version = "1.16", features = ["derive"] }
half = "2.4"
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
mlua = { version = "0.10", features = ["luajit", "vendored", "serialize", "send"] }
prometheus = "0.13"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }
libc = "0.2"
ash = "0.38"
crossbeam = "0.8"
parking_lot = "0.12"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
